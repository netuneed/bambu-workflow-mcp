name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -c requirements.lock.txt -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Native release bundle for verified bootstrap
        run: python scripts/build_release.py --skip-build
      - name: Slice coupon with official native macOS Bambu Studio
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/BambuStudio-v02.09.01.70.dmg"
          curl --fail --location --retry 3 --output "$dmg" 'https://github.com/bambulab/BambuStudio/releases/download/v02.09.01.70/Bambu_Studio_mac-v02.09.01.70-20261103183404.dmg'
          printf '%s  %s\n' 'e4f42ac1542cb107cb21cbf98717de7b17e735bdb46fd2a18249e30929e3310d' "$dmg" | shasum -a 256 --check
          mount_dir=$(mktemp -d "$RUNNER_TEMP/bambu-studio-mount.XXXXXX")
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          test -d "$mount_dir/BambuStudio.app"
          ditto "$mount_dir/BambuStudio.app" "$RUNNER_TEMP/BambuStudio.app"
          file "$RUNNER_TEMP/BambuStudio.app/Contents/MacOS/BambuStudio"
          python scripts/native_slicer_smoke.py --executable "$RUNNER_TEMP/BambuStudio.app" --output-dir "$RUNNER_TEMP/bambu-native-slicer-smoke"
          python scripts/native_multicolor_smoke.py --executable "$RUNNER_TEMP/BambuStudio.app" --output-dir "$RUNNER_TEMP/bambu-native-multicolor-smoke"
      - name: Isolated Windows installation and metadata-only MCP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $checkRoot = Join-Path $env:RUNNER_TEMP 'bambu-workflow-install-check'
          New-Item -ItemType Directory -Path $checkRoot -Force | Out-Null
          $config = Join-Path $checkRoot 'offline-config.json'
          @{version=1; printers=@(); state_dir=(Join-Path $checkRoot 'never-created-state')} | ConvertTo-Json | Set-Content -LiteralPath $config -Encoding utf8
          $before = (Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash
          $wheel = @(Get-ChildItem dist/bambu_workflow_mcp-*.whl)[0].FullName
          $python = (Get-Command python).Source
          $bundle = @(Get-ChildItem dist/bambu-workflow-mcp-*-windows.zip)[0].FullName
          $digest = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash
          & $python ./skills/bambu-print/scripts/bootstrap.py --bundle $bundle --sha256 $digest --install-root $checkRoot --config $config --install-skill --skill-root (Join-Path $checkRoot 'skills')
          if ($LASTEXITCODE -ne 0) { throw 'Verified bootstrap installation failed.' }
          & ./scripts/install.ps1 -WheelPath $wheel -Python $python -InstallRoot $checkRoot -ConfigPath $config -InstallSkill -SkillRoot (Join-Path $checkRoot 'repeated-skills')
          if ($LASTEXITCODE -ne 0) { throw 'Idempotent installation failed.' }
          $version = & python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $runtime = Join-Path $checkRoot "$version/.venv/Scripts/python.exe"
          $client = Join-Path $checkRoot "$version/tools/call_mcp.py"
          if (-not (Test-Path (Join-Path $checkRoot "$version/examples/acceptance-coupon-12x12x1.2mm.stl"))) { throw 'Installed acceptance coupon missing.' }
          if (-not (Test-Path (Join-Path $checkRoot 'skills/bambu-print/scripts/bootstrap.py'))) { throw 'Complete first-run skill missing.' }
          if (-not (Test-Path (Join-Path $checkRoot 'repeated-skills/bambu-print/SKILL.md'))) { throw 'Repeat skill installation was skipped.' }
          & $runtime $client --config $config
          if ($LASTEXITCODE -ne 0) { throw 'MCP catalog failed.' }
          & $runtime $client --python $runtime --config $config --tool cad_import_guidance --timeout 20
          if ($LASTEXITCODE -ne 0) { throw 'Installed utility tool call failed.' }
          & $runtime -m bambu_workflow.cli --config $config lab-check --output (Join-Path $checkRoot 'lab-report.json')
          if ($LASTEXITCODE -ne 0) { throw 'Offline lab report failed.' }
          $report = Get-Content -LiteralPath (Join-Path $checkRoot 'lab-report.json') -Raw | ConvertFrom-Json
          if ($report.status -ne 'blocked' -or $report.printer_contacted -or $report.print_started) { throw 'Invalid offline report boundary.' }
          if ((Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash -ne $before) { throw 'Config changed.' }
          if (Test-Path (Join-Path $checkRoot 'never-created-state')) { throw 'Offline test initialized job state.' }
      - name: Isolated macOS installation and metadata-only MCP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          check_root="$RUNNER_TEMP/bambu-workflow-install-check"
          mkdir -p "$check_root"
          config="$check_root/offline-config.json"
          python -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); p.write_text(json.dumps(dict(version=1,printers=[],state_dir=str(p.parent/"never-created-state"))),encoding="utf-8")' "$config"
          before=$(shasum -a 256 "$config")
          wheel=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("bambu_workflow_mcp-*.whl")).resolve())')
          bundle=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("bambu-workflow-mcp-*-macos.zip")).resolve())')
          digest=$(shasum -a 256 "$bundle" | cut -d ' ' -f1)
          python skills/bambu-print/scripts/bootstrap.py --bundle "$bundle" --sha256 "$digest" --install-root "$check_root" --config "$config" --install-skill --skill-root "$check_root/skills"
          BAMBU_WORKFLOW_CONFIG="$check_root/unwanted-config.json" sh scripts/install.sh --python "$(command -v python)" --wheel-path "$wheel" --install-root "$check_root" --install-skill --skill-root "$check_root/repeated-skills"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test -f "$check_root/$version/examples/acceptance-coupon-12x12x1.2mm.stl"
          test -f "$check_root/skills/bambu-print/scripts/bootstrap.py"
          test -f "$check_root/repeated-skills/bambu-print/SKILL.md"
          python -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1])/sys.argv[2]/".bambu-workflow-runtime.json"; assert json.loads(p.read_text())["config_path"] == sys.argv[3]' "$check_root" "$version" "$config"
          "$check_root/$version/.venv/bin/python" -I -c 'import keyring; assert type(keyring.get_keyring()).__module__ == "keyring.backends.macOS"'
          "$check_root/$version/.venv/bin/python" "$check_root/$version/tools/call_mcp.py" --config "$config"
          "$check_root/$version/.venv/bin/python" "$check_root/$version/tools/call_mcp.py" --python "$check_root/$version/.venv/bin/python" --config "$config" --tool cad_import_guidance --timeout 20
          "$check_root/$version/.venv/bin/python" -m bambu_workflow.cli --config "$config" lab-check --output "$check_root/lab-report.json"
          python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="blocked" and not r["printer_contacted"] and not r["print_started"]' "$check_root/lab-report.json"
          test "$(shasum -a 256 "$config")" = "$before"
          test ! -e "$check_root/never-created-state"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: software-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz
            ${{ runner.temp }}/bambu-native-slicer-smoke/native-slicer-smoke.json
            ${{ runner.temp }}/bambu-native-slicer-smoke/slicer.log
            ${{ runner.temp }}/bambu-native-multicolor-smoke/native-multicolor-smoke.json
            ${{ runner.temp }}/bambu-native-multicolor-smoke/native-multicolor-slicer.log
