[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bambu-workflow-mcp"
version = "0.3.0"
description = "Persistent Blender-to-Bambu print workflows over standard MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mcp>=1.20,<2", "paho-mqtt>=2.1,<3", "trimesh>=4.9,<5",
  "numpy>=2,<3", "keyring>=25,<26", "filelock>=3.16,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
bambu-workflow = "bambu_workflow.cli:main"
bambu-workflow-mcp = "bambu_workflow.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bambu_workflow"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/docs", "/skills", "/examples",
  "/README.md", "/LICENSE", "/pyproject.toml", "/config.example.json",
  "/requirements.lock.txt", "/uv.lock", "/.github", "/.gitignore"
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

