interface:
  display_name: "Bambu Print"
  short_description: "Prepare and review Bambu Lab print jobs"
  default_prompt: "Use $bambu-print to prepare the selected Blender or exported CAD model and review the job before any authorized print."
dependencies:
  tools:
    - type: "mcp"
      value: "bambu_workflow"
      description: "Persistent model-aware Bambu Lab print workflows"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
